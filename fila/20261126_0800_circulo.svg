<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
  <g font-family="Liberation Serif, Georgia, serif" font-style="italic" font-size="55" fill="#F2F2F2">
    <text xml:space="preserve" x="540.0" y="678.6" text-anchor="middle">“Quinta pede</text>
<text xml:space="preserve" x="540.0" y="738.5" text-anchor="middle">pouco:    um    passo</text>
<text xml:space="preserve" x="540.0" y="798.4" text-anchor="middle">honesto,   uma   conversa</text>
<text xml:space="preserve" x="540.0" y="858.2" text-anchor="middle">que        estava        adiada,</text>
<text xml:space="preserve" x="540.0" y="918.1" text-anchor="middle">um  descanso  sem  desculpa.</text>
<text xml:space="preserve" x="540.0" y="978.0" text-anchor="middle">Não     meça     o    dia    pelo</text>
<text xml:space="preserve" x="540.0" y="1037.8" text-anchor="middle">que     faltou,     meça     pelo</text>
<text xml:space="preserve" x="540.0" y="1097.7" text-anchor="middle">que    você    já    sustentou,</text>
<text xml:space="preserve" x="540.0" y="1157.6" text-anchor="middle">e       deixe       a      noite</text>
<text xml:space="preserve" x="540.0" y="1217.4" text-anchor="middle">chegar               leve,</text>
<text xml:space="preserve" x="540.0" y="1277.3" text-anchor="middle">em        paz.”</text>
  </g>
  <text x="540.0" y="1640.8" font-family="Liberation Serif, Georgia, serif" font-style="italic" font-size="26" letter-spacing="2" fill="#B5B5B5" text-anchor="middle">surtodelucidez</text>
  <text x="540.0" y="1652.8" font-family="Liberation Serif, Georgia, serif" font-size="9" letter-spacing="0.6" fill="#8A8A8A" text-anchor="middle">077</text>
</svg>