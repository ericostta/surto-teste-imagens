<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
  <g font-family="Liberation Serif, Georgia, serif" font-style="italic" font-size="55" fill="#F2F2F2">
    <text xml:space="preserve" x="540.0" y="628.4" text-anchor="middle">“MELHORAR</text>
<text xml:space="preserve" x="540.0" y="699.0" text-anchor="middle">NÃO   É   UMA  LINHA</text>
<text xml:space="preserve" x="540.0" y="769.5" text-anchor="middle">RETA:      TEM     DIA     DE</text>
<text xml:space="preserve" x="540.0" y="840.1" text-anchor="middle">AVANÇO E DIA DE RECAÍDA,</text>
<text xml:space="preserve" x="540.0" y="910.6" text-anchor="middle">E  NENHUM  DOS DOIS ANULA</text>
<text xml:space="preserve" x="540.0" y="981.2" text-anchor="middle">O    CAMINHO.    TENHA    COM</text>
<text xml:space="preserve" x="540.0" y="1051.7" text-anchor="middle">VOCÊ     A    PACIÊNCIA    QUE</text>
<text xml:space="preserve" x="540.0" y="1122.3" text-anchor="middle">TERIA  COM  QUEM  AMA EM</text>
<text xml:space="preserve" x="540.0" y="1192.8" text-anchor="middle">RECUPERAÇÃO,    E   SIGA</text>
<text xml:space="preserve" x="540.0" y="1263.4" text-anchor="middle">SEM                 PRESSA,</text>
<text xml:space="preserve" x="540.0" y="1333.9" text-anchor="middle">EM         PAZ.”</text>
  </g>
