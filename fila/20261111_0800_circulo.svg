<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1080" height="1920" fill="#000000"/>
  <g font-family="Liberation Serif, Georgia, serif" font-style="italic" font-size="55" fill="#F2F2F2">
    <text xml:space="preserve" x="540.0" y="708.3" text-anchor="middle">“Quarta é o</text>
<text xml:space="preserve" x="540.0" y="761.8" text-anchor="middle">meio  da travessia,</text>
<text xml:space="preserve" x="540.0" y="815.4" text-anchor="middle">nem começo animado,</text>
<text xml:space="preserve" x="540.0" y="868.9" text-anchor="middle">nem  fim aliviado; honre</text>
<text xml:space="preserve" x="540.0" y="922.5" text-anchor="middle">o   que   já  andou,  ajuste</text>
<text xml:space="preserve" x="540.0" y="976.1" text-anchor="middle">o    passo    sem    culpa   e</text>
<text xml:space="preserve" x="540.0" y="1029.6" text-anchor="middle">siga  com  calma,  porque</text>
<text xml:space="preserve" x="540.0" y="1083.2" text-anchor="middle">chegar  inteiro vale mais</text>
<text xml:space="preserve" x="540.0" y="1136.8" text-anchor="middle">do    que    chegar   de</text>
<text xml:space="preserve" x="540.0" y="1190.3" text-anchor="middle">qualquer        jeito,</text>
<text xml:space="preserve" x="540.0" y="1243.9" text-anchor="middle">em      paz.”</text>
  </g>
  <text x="540.0" y="1632.5" font-family="Liberation Serif, Georgia, serif" font-style="italic" font-size="26" letter-spacing="2" fill="#B5B5B5" text-anchor="middle">surtodelucidez</text>
  <text x="540.0" y="1644.5" font-family="Liberation Serif, Georgia, serif" font-size="9" letter-spacing="0.6" fill="#8A8A8A" text-anchor="middle">062</text>
</svg>